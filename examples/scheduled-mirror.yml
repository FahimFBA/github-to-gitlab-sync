# Mirror on a schedule, and on demand from the Actions tab.
name: Scheduled GitLab mirror

on:
  schedule:
    - cron: '17 3 * * *' # every day at 03:17 UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Show what would be pushed without pushing'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    concurrency:
      group: gitlab-mirror
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: FahimFBA/github-to-gitlab-sync@v1
        with:
          gitlab-token: ${{ secrets.GITLAB_TOKEN }}
          gitlab-repo: my-group/my-project
          dry-run: ${{ inputs.dry-run || false }}
