# Copy this file to .github/workflows/ci.yml in your own fork.
# It is kept in examples/ on purpose: Marketplace action repos must not ship workflow files.
name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: shellcheck scripts/sync.sh tests/run-tests.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        shell: bash
        run: bash tests/run-tests.sh
